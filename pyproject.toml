[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal_app"
requires-python = ">=3.11"
description = 'Library for terminal application'
readme = "README.md"
authors = [{ name = "Antonio Rodrigues", email = "axtonio.code@gmail.com" }]
keywords = ["terminal_app", "mipt"]
dependencies = [
	"numpy",
	"tqdm",
	"certifi",
	"natsort",
	"pydantic>=2",
	"tabulate",
	"paramiko",
	"requests",
	"hydra-core",
	"python-dotenv",
]
dynamic = ["version"]

[project.urls]
GitHub = "https://github.com/axtonio/terminal_app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["terminal_app*"]

[tool.setuptools.dynamic]
version = { attr = "terminal_app.__version__" }


[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    # selenium-wire vendors legacy mitmproxy; keep these exceptions scoped to it.
    'ignore:pkg_resources is deprecated as an API:Warning:seleniumwire\.thirdparty\.mitmproxy\.contrib\.kaitaistruct\.tls_client_hello',
    "ignore:'leaveWhitespace' deprecated:DeprecationWarning:seleniumwire\\.thirdparty\\.mitmproxy\\.command_lexer",
]


[project.optional-dependencies]
dev = ["pytest", "setuptools", "types-requests", "types-tqdm", "types-tabulate", "google-api-python-client-stubs"]
request_utils = ["selenium", "selenium-wire", "blinker<1.8", "setuptools<81", "paramiko"]
google_sheets = [
	"gspread",
	"pandas",
	"google-auth",
	"google-auth-oauthlib",
	"google-api-python-client",
	"gspread-dataframe",
	"gspread-formatting",
	"tenacity",
]
