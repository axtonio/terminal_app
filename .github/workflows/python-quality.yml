name: Python quality and tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: python-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .quality/requirements.lock
      - name: Install application and development dependencies
        run: python -m pip install -e ".[dev,request_utils,google_sheets]"
      - name: Check Python quality
        run: make quality PYTHON=python
      - name: Run tests
        run: python -m pytest -q
