[importlinter]
root_packages =
    terminal_app
include_external_packages = True

[importlinter:contract:processing-isolation]
name = Processing and utilities stay independent of configuration and network integrations
type = forbidden
source_modules =
    terminal_app.processing_utils
    terminal_app.utils
    terminal_app.logging
forbidden_modules =
    terminal_app.env
    terminal_app.request_utils
    terminal_app.google_sheets

[importlinter:contract:utility-layers]
name = Processing uses utilities and logging without reverse dependencies
type = layers
layers =
    terminal_app.processing_utils
    terminal_app.utils
    terminal_app.logging
