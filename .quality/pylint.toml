[tool.pylint.main]
py-version = "3.11"
persistent = false

[tool.pylint.messages_control]
disable = ["all"]
enable = ["C0302", "E0110", "E0211", "E0213", "W0201", "W0221", "W0222", "W0223", "W0231", "W0233", "W0236"]

[tool.pylint.format]
max-module-lines = 400

[tool.pylint.reports]
reports = false
score = false
