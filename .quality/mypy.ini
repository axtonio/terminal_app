[mypy]
python_version = 3.11
check_untyped_defs = True
warn_unused_ignores = True
show_error_codes = True
explicit_package_bases = True

# These optional integrations do not publish type information. Their installed
# packages are still included in the import and runtime checks.
[mypy-seleniumwire.*,google_auth_oauthlib.*,gspread_dataframe.*,gspread_formatting.*]
ignore_missing_imports = True
